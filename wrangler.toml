name = "speedster"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "WISP"
class_name = "Wisp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Wisp"]

[vars]
UPSTREAM_WISP = ""
BLOCKED_HOSTS = ""
ALLOW_PRIVATE = ""
SHARDS = "16"
